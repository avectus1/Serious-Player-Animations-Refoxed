plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}

version = '1.2.0-neoforge'
group = 'net.mcvader.seriousplayeranimations'
base { archivesName = 'seriousplayeranimations' }

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

repositories {
    exclusiveContent {
        forRepository { maven { name = 'Modrinth'; url = 'https://api.modrinth.com/maven' } }
        filter { includeGroup 'maven.modrinth' }
    }
}

neoForge {
    version = '21.1.249'
    mods { seriousplayeranimations { sourceSet sourceSets.main } }
    runs { client { client() } }
}

// Compile-only stubs for Fabric-only compat mods (Ultracraft, Old Combat Mod, Trigger Happy).
// They are never packaged into the jar.
sourceSets { stubs { java { srcDir 'stubs/java' } } }
neoForge { addModdingDependenciesTo(sourceSets.stubs) }

dependencies {
    // Modrinth version IDs pin the NeoForge 1.21.1 builds
    implementation 'maven.modrinth:playeranimator:HJZB6bmA'
    implementation 'maven.modrinth:cloth-config:izKINKFg'

    // Optional compat mods (compile only)
    compileOnly 'maven.modrinth:not-enough-animations:VCuMsK45'
    compileOnly 'maven.modrinth:carry-on:PV8oLZ1q'
    compileOnly 'maven.modrinth:supplementaries:rWq0ko29'
    compileOnly 'maven.modrinth:moonlight:fAIfWX6M'
    compileOnly 'maven.modrinth:immersive-melodies:RLpigSXC'
    compileOnly 'maven.modrinth:sword-blocking:F2wy0XlU'
    compileOnly sourceSets.stubs.output
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}
